[package]
name = "pipeweaver-lv2ui"
description = "Open the native LV2 UI of a filter running inside Pipeweaver"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

# Daemon API (same websocket the web UI uses)
tungstenite = "0.28"

# LV2 hosting
lilv-sys = "0.2.1"
libloading = "0.8"
rtrb = "0.3"

# The plugin UI is embedded in a plain X11 window (LSP ships X11 UIs)
x11rb = "0.13"

# Same fork and revision Pipeweaver itself builds against (it has the pw_filter API)
pipewire = { git = "https://github.com/FrostyCoolSlug/pipewire-rs.git", rev = "4d2195fb6677cf0f106b0f32fd1284c27d2c6a4c", features = ["v0_3_45"] }
